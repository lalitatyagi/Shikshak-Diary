# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect this repo in the Render dashboard and apply the Blueprint.
services:
  - type: web
    name: classroom-tracker-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run db:generate && npm run build -w @classroom-tracker/api
    startCommand: npm run start:deploy -w @classroom-tracker/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      - key: SMS_OTP_MODE
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
